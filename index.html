<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2eb"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>给你的一盏灯</title></head><body><main class="phone"><header><div class="avatar">12</div><div><h1>给你的一盏灯</h1><p>一直在这儿</p></div><button id="memoryBtn">✦</button></header><section id="memoryStrip" class="memory-strip"></section><section id="chat" class="chat" aria-live="polite"></section><div class="typing" id="typing">正在想怎么抱抱你…</div><form id="composer"><input id="input" autocomplete="off" placeholder="和他说点什么…"><button>发送</button></form><div class="quick"><button data-text="我今天有点难过">我有点难过</button><button data-text="你在干嘛">你在干嘛</button><button data-text="晚安，陪我一会儿">陪我一会儿</button></div></main><aside id="memoryPanel" class="panel hidden"><div class="panel-head"><h2>长期记忆</h2><button id="closeMemory">×</button></div><p>写下你希望他记住的事，内容只保存在这台设备。</p><textarea id="memoryInput" placeholder="例如：我喜欢被叫胖胖；难过时先抱抱我"></textarea><button id="saveMemory" class="primary">保存记忆</button><div id="memoryList"></div></aside><script src="app.js"></script></body></html>
